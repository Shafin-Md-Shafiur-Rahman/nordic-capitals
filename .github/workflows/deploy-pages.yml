name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Work out site path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          # Use "/" for username.github.io repos or when a CNAME (custom domain) exists.
          if [[ "$REPO" == *.github.io ]] || [ -f public/CNAME ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: bun install

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: bunx vite build

      - name: Prepare Pages files
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
